<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Inventarios - UCompensar</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        h1, h2 { color: #333; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 45%; min-width: 300px; }
        input, select, button { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        button { background-color: #0056b3; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #003d80; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h1>Sistema de Gestión de Inventarios</h1>

    <div class="container">
        <!-- MÓDULO 1: Ver Productos y Stock -->
        <div class="card">
            <h2>Inventario de Productos</h2>
            <button onclick="cargarProductos()">Cargar Productos</button>
            <table id="tablaProductos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Stock</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- MÓDULO 2: Crear Pedido (Actualiza Stock) -->
        <div class="card">
            <h2>Registrar Nuevo Pedido</h2>
            <form id="formPedido">
                <label>ID Cliente:</label>
                <input type="number" id="idCliente" required>

                <label>ID Producto:</label>
                <input type="number" id="idProducto" required>

                <label>Cantidad:</label>
                <input type="number" id="cantidad" required>

                <button type="button" onclick="registrarPedido()">Crear Pedido y Descontar Stock</button>
            </form>
            <div id="mensajePedido" style="margin-top:10px; font-weight:bold;"></div>
        </div>

        <!-- MÓDULO 3: Historial por Cliente -->
        <div class="card" style="width: 93%;">
            <h2>Consultar Historial de Entregas por Cliente</h2>
            <input type="number" id="buscarClienteId" placeholder="Ingrese ID del Cliente">
            <button onclick="consultarHistorial()">Buscar Historial</button>
            <table id="tablaHistorial">
                <thead>
                    <tr>
                        <th>ID Entrega</th>
                        <th>ID Pedido</th>
                        <th>Fecha Entrega</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/inventariosPrueba-1.0-SNAPSHOT/api';

        // 1. Cargar productos con Fetch API
        async function cargarProductos() {
            try {
                const res = await fetch(`${API_URL}/productos`);
                const data = await res.json();
                const tbody = document.querySelector('#tablaProductos tbody');
                tbody.innerHTML = '';
                data.forEach(p => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${p.idProducto}</td>
                            <td>${p.nombre}</td>
                            <td>$${p.precio}</td>
                            <td><strong>${p.stock}</strong></td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Error al cargar productos:', err);
            }
        }

        // 2. Registrar Pedido y descontar stock automáticamente
        async function registrarPedido() {
            const idCliente = parseInt(document.getElementById('idCliente').value);
            const idProducto = parseInt(document.getElementById('idProducto').value);
            const cantidad = parseInt(document.getElementById('cantidad').value);

            const payload = {
                pedido: { cliente: { idCliente: idCliente } },
                detalles: [{ producto: { idProducto: idProducto }, cantidad: cantidad }]
            };

            try {
                const res = await fetch(`${API_URL}/pedidos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                document.getElementById('mensajePedido').innerText = result.mensaje || result.error;
                cargarProductos(); // Refrescar inventario automáticamente
            } catch (err) {
                document.getElementById('mensajePedido').innerText = 'Error al procesar pedido';
            }
        }

        // 3. Consultar Historial por Cliente
        async function consultarHistorial() {
            const idCliente = document.getElementById('buscarClienteId').value;
            if (!idCliente) return;

            try {
                const res = await fetch(`${API_URL}/pedidos/historial/${idCliente}`);
                const data = await res.json();
                const tbody = document.querySelector('#tablaHistorial tbody');
                tbody.innerHTML = '';
                data.forEach(h => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${h.idEntrega}</td>
                            <td>${h.pedido ? h.pedido.idPedido : 'N/A'}</td>
                            <td>${h.fechaEntrega}</td>
                            <td>${h.estadoEntrega}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Error al consultar historial:', err);
            }
        }
    </script>
</body>
</html>
